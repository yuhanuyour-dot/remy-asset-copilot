<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self'; connect-src 'self' blob: data:; worker-src blob:;">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;font:13px 'Segoe UI',sans-serif;color:#6c6c74}
#scene{display:block;outline:none;border-radius:18px}#scene:focus-visible{outline:2px solid #6b6b76;outline-offset:-3px}
#pick-image{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border:1px dashed transparent;border-radius:18px;background:#f7f7f9;cursor:pointer;font:inherit;color:#6c6c74}

#message{position:absolute;inset:0;display:none;flex-direction:column;gap:14px;align-items:center;justify-content:center;text-align:center;line-height:1.75;pointer-events:none;border-radius:18px;background:#f7f7f9;padding:24px;box-sizing:border-box}

#loading-blocks{width:116px;height:88px;image-rendering:pixelated;display:none}
